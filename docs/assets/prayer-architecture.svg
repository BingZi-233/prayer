<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prayer 五层运行架构</title>
  <desc id="desc">Prayer 以 lib/runtime.ts 为组合根，按 conversation、channels 与 knowledge、model、core 五层单向依赖运行；Next.js App Router 可依赖全部层，管理后台组件只依赖 core，并连接 QQ、Telegram、插件与 MCP、本地 SQLite 和 embedding 模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="1" stop-color="#EEF2FC" />
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D4A" />
      <stop offset="0.58" stop-color="#273D91" />
      <stop offset="1" stop-color="#6A59D9" />
    </linearGradient>
    <linearGradient id="conversation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F62D8" />
      <stop offset="1" stop-color="#7568E8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C2C61" flood-opacity="0.10" /></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#7180B4" /></marker>
    <style>
      .font {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        fill: #14204b;
      }
      .subtitle {
        font-size: 16px;
        fill: #647096;
      }
      .section {
        font-size: 17px;
        font-weight: 700;
        fill: #14204b;
      }
      .body {
        font-size: 13px;
        font-weight: 500;
        fill: #687398;
      }
      .small {
        font-size: 12px;
        font-weight: 500;
        fill: #7480a5;
      }
      .note {
        font-size: 11px;
        font-weight: 600;
        fill: #6b78a9;
      }
      .root-title {
        font-size: 20px;
        font-weight: 700;
        fill: #fff;
      }
      .root-copy {
        font-size: 13px;
        fill: #c9d4ff;
      }
      .layer-title {
        font-size: 17px;
        font-weight: 700;
        fill: #fff;
      }
      .layer-copy {
        font-size: 12px;
        font-weight: 500;
        fill: #e6e9ff;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
      }
      .card-copy {
        font-size: 12px;
        font-weight: 500;
      }
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)" />
  <text x="64" y="68" class="font title">运行架构</text>
  <text x="64" y="98" class="font subtitle">五层单向依赖 · 一个 Node.js 进程 · Next.js 16 App Router</text>
  <rect x="1280" y="48" width="256" height="34" rx="17" fill="#E7EBFF" />
  <text x="1408" y="70" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#4156B8">Prayer / 单实例 Node runtime</text>

  <rect x="64" y="208" width="220" height="190" rx="22" fill="#FFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="92" y="246" class="font section">外部接入</text>
  <text x="92" y="271" class="font body">消息从通道进入编排</text>
  <g transform="translate(92 291)">
    <rect width="164" height="40" rx="12" fill="#F3F6FF" />
    <circle cx="21" cy="20" r="12" fill="#DDE5FF" />
    <path d="M15 17H27V25H15Z M18 15V18M24 15V18" fill="none" stroke="#3E59D3" stroke-width="1.6" stroke-linecap="round" />
    <text x="42" y="25" class="font card-title" fill="#263A83">QQ / OneBot</text>
  </g>
  <g transform="translate(92 343)">
    <rect width="164" height="40" rx="12" fill="#F7F3FF" />
    <circle cx="21" cy="20" r="12" fill="#E9E1FF" />
    <path d="M15 16H27V25H15Z M18 19H24" fill="none" stroke="#7564E5" stroke-width="1.6" stroke-linecap="round" />
    <text x="42" y="25" class="font card-title" fill="#4E3B99">Telegram</text>
  </g>
  <path d="M284 303H342" fill="none" stroke="#7180B4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="296" y="290" class="font note">入站消息</text>

  <rect x="366" y="128" width="820" height="92" rx="24" fill="url(#root)" filter="url(#shadow)" />
  <circle cx="410" cy="174" r="20" fill="#FFF" fill-opacity=".13" />
  <path d="M401 174L407 180L419 167" fill="none" stroke="#77E1C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="446" y="166" class="font root-title">组合根 · lib/runtime.ts</text>
  <text x="446" y="191" class="font root-copy">装配依赖、管理生命周期，拉起 Agent、通道与后台循环</text>
  <text x="1108" y="166" text-anchor="end" class="font" font-size="12" font-weight="700" fill="#AFC0FF">composition</text>
  <path d="M776 220V250" fill="none" stroke="#7180B4" stroke-width="2.5" marker-end="url(#arrow)" />

  <rect x="366" y="250" width="820" height="78" rx="20" fill="url(#conversation)" filter="url(#shadow)" />
  <text x="402" y="281" class="font layer-title">conversation · 会话与编排</text>
  <text x="402" y="305" class="font layer-copy">Agent、网关、缓冲区、人工接管与会话轮询</text>
  <text x="1148" y="281" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#DDE2FF">L3</text>
  <path d="M776 328V350" fill="none" stroke="#7180B4" stroke-width="2.5" marker-end="url(#arrow)" />

  <rect x="366" y="350" width="390" height="112" rx="20" fill="#FFF" stroke="#D9DFF0" filter="url(#shadow)" />
  <rect x="366" y="350" width="8" height="112" rx="4" fill="#59BDEB" />
  <text x="398" y="385" class="font card-title" fill="#176D9F">channels · 通道</text>
  <text x="398" y="409" class="font card-copy" fill="#687398">QQ / OneBot、Telegram、通道注册与状态</text>
  <text x="398" y="434" class="font small">共享 core 词汇与基础设施</text>
  <text x="720" y="382" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#2B9DD7">L2</text>
  <rect x="796" y="350" width="390" height="112" rx="20" fill="#FFF" stroke="#D9DFF0" filter="url(#shadow)" />
  <rect x="796" y="350" width="8" height="112" rx="4" fill="#C49AF4" />
  <text x="828" y="385" class="font card-title" fill="#6042A8">knowledge · 知识</text>
  <text x="828" y="409" class="font card-copy" fill="#687398">知识库检索、反思整理与内容升格</text>
  <text x="828" y="434" class="font small">与 channels 同级，互不依赖</text>
  <text x="1150" y="382" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#8A64D6">L2</text>
  <path d="M561 462V488M991 462V488" fill="none" stroke="#7180B4" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="776" y="478" text-anchor="middle" class="font note">同级并列 · 无相互依赖</text>

  <rect x="366" y="488" width="820" height="84" rx="20" fill="#4456A7" filter="url(#shadow)" />
  <text x="402" y="522" class="font layer-title">model · 模型基座</text>
  <text x="402" y="547" class="font layer-copy">SDK 环境、prompt、工具白名单、drain、嵌入与用量计量</text>
  <text x="1148" y="522" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#CFD7FF">L1</text>
  <path d="M776 572V594" fill="none" stroke="#7180B4" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="366" y="594" width="820" height="84" rx="20" fill="#1F3478" filter="url(#shadow)" />
  <text x="402" y="628" class="font layer-title">core · 核心地基</text>
  <text x="402" y="653" class="font layer-copy">SQLite 数据访问与迁移、配置、日志、事件总线、纯函数</text>
  <text x="1148" y="628" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#B9C8FF">L0</text>

  <rect x="64" y="520" width="220" height="158" rx="22" fill="#FFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="92" y="557" class="font section">本地资源</text>
  <text x="92" y="581" class="font body">数据与向量均留在本机</text>
  <g transform="translate(92 600)">
    <rect width="164" height="30" rx="10" fill="#F3F6FF" />
    <text x="82" y="20" text-anchor="middle" class="font card-copy" fill="#263A83">SQLite · sqlite-vec</text>
  </g>
  <g transform="translate(92 640)">
    <rect width="164" height="30" rx="10" fill="#F7F3FF" />
    <text x="82" y="20" text-anchor="middle" class="font card-copy" fill="#6042A8">本地 embedding · bge-small-zh-v1.5</text>
  </g>
  <path d="M284 633H350C360 633 360 636 366 636" fill="none" stroke="#A5B0D2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" />
  <text x="294" y="620" class="font note">读写 / 推理</text>

  <rect x="1230" y="208" width="306" height="270" rx="22" fill="#FFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="1262" y="246" class="font section">应用表面</text>
  <text x="1262" y="271" class="font body">上层消费者，不改变核心分层</text>
  <g transform="translate(1262 294)">
    <rect width="242" height="68" rx="16" fill="#F3F6FF" />
    <text x="20" y="28" class="font card-title" fill="#263A83">app/ · App Router</text>
    <text x="20" y="50" class="font card-copy" fill="#687398">页面与 API，可依赖全部五层</text>
  </g>
  <g transform="translate(1262 378)">
    <rect width="242" height="68" rx="16" fill="#F7F3FF" />
    <text x="20" y="28" class="font card-title" fill="#6042A8">components/ · UI</text>
    <text x="20" y="50" class="font card-copy" fill="#687398">展示组件只依赖 core 纯函数</text>
  </g>
  <path d="M1230 328H1198M1230 412H1198" fill="none" stroke="#7180B4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1198" y="316" text-anchor="end" class="font note">依赖</text>
  <text x="1198" y="400" text-anchor="end" class="font note">core only</text>

  <rect x="1230" y="520" width="306" height="158" rx="22" fill="#FFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="1262" y="557" class="font section">扩展边界</text>
  <text x="1262" y="581" class="font body">插件由 Agent SDK 以 MCP 方式接入</text>
  <g transform="translate(1262 600)">
    <rect width="242" height="30" rx="10" fill="#FFF9EA" />
    <text x="121" y="20" text-anchor="middle" class="font card-copy" fill="#9B6711">plugins/ · cs / packyapi</text>
  </g>
  <g transform="translate(1262 640)">
    <rect width="242" height="30" rx="10" fill="#FFF4E5" />
    <text x="121" y="20" text-anchor="middle" class="font card-copy" fill="#A66815">MCP server · tools</text>
  </g>
  <path d="M1230 620H1198" fill="none" stroke="#D1A45E" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" />
  <text x="1198" y="608" text-anchor="end" class="font note">工具调用</text>

  <rect x="64" y="754" width="1472" height="86" rx="20" fill="#FFF" stroke="#E1E6F2" />
  <circle cx="96" cy="788" r="6" fill="#7180B4" />
  <text x="112" y="792" class="font body">实线箭头：代码层级的单向依赖</text>
  <line x1="352" y1="788" x2="390" y2="788" stroke="#A5B0D2" stroke-width="2" stroke-dasharray="6 6" />
  <text x="404" y="792" class="font body">虚线箭头：外部资源或运行时边界</text>
  <text x="96" y="820" class="font small">启动入口：instrumentation.ts → runtime.ts；生产部署为单个 next start 进程</text>
  <text x="1504" y="820" text-anchor="end" class="font small">由上至下：组合与编排 → 适配与知识 → 模型 → 基础设施</text>
</svg>
