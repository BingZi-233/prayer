<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">祈愿运行架构</title>
  <desc id="desc">祈愿从多渠道消息接入，到 Agent Runtime、业务工具、数据存储和运营后台的完整架构</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="1" stop-color="#EEF2FC" />
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D4A" />
      <stop offset="0.58" stop-color="#273D91" />
      <stop offset="1" stop-color="#6A59D9" />
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B5BDB" />
      <stop offset="1" stop-color="#8A78F4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1C2C61" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="#6B78A9" />
    </marker>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #14204B; }
      .subtitle { font-size: 16px; font-weight: 400; fill: #647096; }
      .section { font-size: 20px; font-weight: 700; fill: #14204B; }
      .body { font-size: 14px; font-weight: 500; fill: #687398; }
      .small { font-size: 12px; font-weight: 500; fill: #7480A5; }
      .runtime-title { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
      .runtime-copy { font-size: 14px; font-weight: 400; fill: #C9D4FF; }
      .runtime-item { font-size: 14px; font-weight: 600; fill: #FFFFFF; }
      .compact-title { font-size: 14px; font-weight: 700; }
      .loop-title { font-size: 18px; font-weight: 700; fill: #14204B; }
      .loop-copy { font-size: 14px; font-weight: 500; fill: #687398; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)" />

  <text x="72" y="78" class="font title">运行架构</text>
  <text x="72" y="112" class="font subtitle">一个 Node.js 进程，串起接入、智能、数据与运营</text>
  <rect x="1230" y="58" width="298" height="38" rx="19" fill="#E7EBFF" />
  <text x="1379" y="83" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#4156B8">Next.js 16 · Node.js · SQLite</text>

  <!-- 消息接入 -->
  <rect x="72" y="174" width="300" height="352" rx="26" fill="#FFFFFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="110" y="224" class="font section">消息接入</text>
  <text x="110" y="252" class="font body">多渠道消息统一汇入运行时</text>

  <g transform="translate(110 274)">
    <rect width="224" height="62" rx="16" fill="#F3F6FF" />
    <circle cx="28" cy="31" r="20" fill="#DDE5FF" />
    <path d="M18 26H38V38H18Z" fill="none" stroke="#3E59D3" stroke-width="2.2" />
    <path d="M23 23V28M33 23V28" stroke="#3E59D3" stroke-width="2.2" stroke-linecap="round" />
    <text x="62" y="29" class="font" font-size="16" font-weight="700" fill="#263A83">QQ / OneBot</text>
    <text x="62" y="49" class="font small">NapCat 正向 WebSocket</text>
  </g>
  <g transform="translate(110 356)">
    <rect width="224" height="62" rx="16" fill="#F7F3FF" />
    <circle cx="28" cy="31" r="20" fill="#E9E1FF" />
    <path d="M18 24H38V39H18Z" fill="none" stroke="#7564E5" stroke-width="2.2" />
    <path d="M22 29H34M22 34H30" stroke="#7564E5" stroke-width="2.2" stroke-linecap="round" />
    <text x="62" y="29" class="font" font-size="16" font-weight="700" fill="#4E3B99">Telegram</text>
    <text x="62" y="49" class="font small">单进程 long polling</text>
  </g>
  <g transform="translate(110 438)">
    <rect width="224" height="62" rx="16" fill="#F2FAFF" />
    <circle cx="28" cy="31" r="20" fill="#D9F3FF" />
    <path d="M18 31H38M28 21V41" stroke="#2B9DD7" stroke-width="2.2" stroke-linecap="round" />
    <text x="62" y="29" class="font" font-size="16" font-weight="700" fill="#176D9F">生效会话</text>
    <text x="62" y="49" class="font small">白名单与触发规则</text>
  </g>

  <!-- 留出箭头尖端的呼吸空间，避免被后绘制的核心卡片遮住 -->
  <path d="M372 350H406" fill="none" stroke="#6B78A9" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Agent Runtime -->
  <rect x="420" y="150" width="700" height="400" rx="30" fill="url(#runtime)" filter="url(#shadow)" />
  <text x="464" y="204" class="font runtime-title">祈愿 Agent Runtime</text>
  <text x="464" y="231" class="font runtime-copy">同一套编排，服务所有通道和后台循环</text>

  <g transform="translate(464 270)">
    <rect width="612" height="48" rx="15" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="28" cy="24" r="8" fill="#65D8FF" />
    <text x="52" y="30" class="font runtime-item">消息网关 · 解析、过滤、媒体与通道分发</text>
  </g>
  <g transform="translate(464 326)">
    <rect width="612" height="48" rx="15" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="28" cy="24" r="8" fill="#8D7CFF" />
    <text x="52" y="30" class="font runtime-item">会话编排 · 上下文、意图与回复策略</text>
  </g>
  <g transform="translate(464 382)">
    <rect width="612" height="48" rx="15" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="28" cy="24" r="8" fill="#F5C46A" />
    <text x="52" y="30" class="font runtime-item">Agent + Tools · 知识、业务工具与插件</text>
  </g>
  <g transform="translate(464 438)">
    <rect width="612" height="48" rx="15" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="28" cy="24" r="8" fill="#77E1C1" />
    <text x="52" y="30" class="font runtime-item">人机协作 + 后台循环 · 转人工、反思与主动补位</text>
  </g>
  <text x="464" y="514" class="font" font-size="13" fill="#C9D4FF">所有能力在同一进程内协同，状态和上下文可持续复用</text>

  <!-- 两条水平线分别对应业务层和运营层；箭头在卡片外完整可见 -->
  <path d="M1120 319H1146" fill="none" stroke="#6B78A9" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M1120 427H1146" fill="none" stroke="#6B78A9" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 业务与运营 -->
  <rect x="1160" y="174" width="368" height="352" rx="26" fill="#FFFFFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="1198" y="224" class="font section">业务与运营</text>
  <text x="1198" y="252" class="font body">把服务结果变成可管理的系统</text>

  <g transform="translate(1198 278)">
    <rect width="292" height="82" rx="18" fill="#F3F6FF" />
    <circle cx="31" cy="41" r="21" fill="#DDE5FF" />
    <path d="M24 41L31 34L38 41L31 48Z" fill="none" stroke="#3E59D3" stroke-width="2" />
    <text x="68" y="35" class="font" font-size="16" font-weight="700" fill="#263A83">业务能力</text>
    <text x="68" y="59" class="font small">插件 / MCP · 管理后台</text>
  </g>
  <g transform="translate(1198 386)">
    <rect width="292" height="82" rx="18" fill="#FFF9EA" />
    <circle cx="31" cy="41" r="21" fill="#FFE9B7" />
    <path d="M24 47V39M31 47V32M38 47V36" stroke="#D99422" stroke-width="2.2" stroke-linecap="round" />
    <text x="68" y="35" class="font" font-size="16" font-weight="700" fill="#9B6711">运营能力</text>
    <text x="68" y="59" class="font small">可观测性 · 运营闭环</text>
  </g>

  <!-- 持续学习闭环 -->
  <rect x="72" y="584" width="1456" height="244" rx="30" fill="#FFFFFF" stroke="#E1E6F2" filter="url(#shadow)" />
  <text x="110" y="636" class="font section">持续学习闭环</text>
  <text x="110" y="664" class="font body">每一次人工解答，都有机会成为下一次更稳定的自动回答</text>
  <rect x="1330" y="616" width="152" height="34" rx="17" fill="#E8ECFF" />
  <text x="1406" y="639" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#3C56C0">SQLite + sqlite-vec</text>

  <g transform="translate(110 704)">
    <rect width="190" height="58" rx="18" fill="#F3F6FF" />
    <text x="95" y="36" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#263A83">真实会话</text>
    <path d="M208 29H234" stroke="#7A86B2" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="252" width="190" height="58" rx="18" fill="#F7F3FF" />
    <text x="347" y="36" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#4E3B99">人工 / 反思</text>
    <path d="M460 29H486" stroke="#7A86B2" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="504" width="190" height="58" rx="18" fill="#F2FAFF" />
    <text x="599" y="36" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#176D9F">整理与升格</text>
    <path d="M712 29H738" stroke="#7A86B2" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="756" width="190" height="58" rx="18" fill="#FFF9EA" />
    <text x="851" y="36" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#9B6711">知识库</text>
    <path d="M964 29H990" stroke="#7A86B2" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="1008" width="190" height="58" rx="18" fill="#F3F6FF" />
    <text x="1103" y="36" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#263A83">下一次回答</text>
  </g>

  <!-- 从最后一步回流到真实会话，形成闭环 -->
  <path d="M1213 762C1213 790 1180 804 1120 804H205V762" fill="none" stroke="url(#active)" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)" />
</svg>
